[build]
  command = "npm run ci:netlify"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["node_modules/sql.js/dist/sql-wasm.wasm"]

[[redirects]]
  from = "/playwright-report/*"
  to = "/public/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/test-results/*"
  to = "/public/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/"
  to = "/public/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
